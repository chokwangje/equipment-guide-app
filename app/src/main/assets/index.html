<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>설비 안내서 제작기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8edf3;color:#1d2939;font:13px Arial,"Malgun Gothic",sans-serif}button,input,textarea{font:inherit}.top{height:46px;background:#fff;border-bottom:1px solid #d8e0ea;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.logo{font-weight:900;color:#173966;font-size:16px}.top button,.tools button,.upload{border:1px solid #d8e0ea;background:#fff;border-radius:5px;padding:6px 9px;cursor:pointer}.top .print{background:#173966;color:#fff}.app{height:calc(100vh - 46px);display:grid;grid-template-columns:190px 1fr}.side{background:#fff;border-right:1px solid #d8e0ea;padding:8px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;font-weight:bold;color:#667085;padding:4px}.head button{border:0;background:#edf2f7;border-radius:4px}.list button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:7px;border-radius:5px;cursor:pointer}.list button.on{background:#173966;color:#fff;font-weight:bold}.mini{display:flex;gap:4px;margin:5px 0 10px}.mini button{flex:1;border:1px solid #d8e0ea;background:#fff;border-radius:4px;padding:4px}.editor{min-width:0;overflow:hidden}.tools{height:42px;background:#fff;border-bottom:1px solid #d8e0ea;display:flex;align-items:center;gap:5px;padding:5px 9px;overflow:auto}.tools button,.upload{white-space:nowrap;padding:5px 8px}.upload{background:#e9f2fc;color:#174b83;font-weight:bold}.upload input,.empty input{display:none}.stage{height:calc(100vh - 88px);padding:8px;overflow:auto;display:flex;justify-content:center}.paper{position:relative;background:#fff;width:430px;min-height:608px;padding:20px 26px 14px;box-shadow:0 4px 18px #26344824}.paper:before{content:"";position:absolute;inset:6px;border:1px solid #dce3ec;pointer-events:none}.band{display:flex;gap:7px;align-items:center;border-bottom:2px solid #173966;padding-bottom:6px;font-size:11px}.band span{background:#173966;color:#fff;padding:3px 7px;border-radius:3px;font-weight:bold}.band i{margin-left:auto;color:#98a2b3}.title{width:100%;border:0;border-bottom:1px solid #e5eaf0;padding:11px 2px 7px;font-size:17px;font-weight:900;color:#173966;outline:0}.photo{height:250px;margin-top:9px;border:1px solid #d8e0ea;background:#f1f4f8;position:relative;overflow:hidden}.photo>img{width:100%;height:100%;object-fit:contain}.empty{height:100%;display:grid;place-content:center;text-align:center;color:#667085;cursor:pointer}.empty b{display:block;font-size:13px}.empty strong{font-size:28px;color:#315b88}.mark{position:absolute;z-index:2;cursor:move;touch-action:none}.box,.circle{border:3px solid #ef4444}.circle{border-radius:50%}.text{font-size:18px;font-weight:bold;text-shadow:0 0 3px #fff;color:#ef4444;display:grid;place-items:center;text-align:center}.arrow{font-size:34px;color:#f59e0b}.mark.sel{outline:1px dashed #2563eb;outline-offset:3px}.handle{position:absolute;right:-7px;bottom:-7px;width:15px;height:15px;border-radius:50%;background:#2563eb;color:#fff;font-size:9px;display:grid;place-items:center}.adjust{display:none;margin-top:4px;padding:4px 6px;background:#f6f8fb;border:1px solid #d8e0ea;font-size:10px;gap:8px;align-items:center}.adjust.show{display:flex}.adjust label{display:flex;align-items:center;gap:3px}.adjust input[type=range]{width:60px}.desc{margin-top:7px;border:1px solid #d8e0ea;border-left:3px solid #173966;padding:6px 8px}.desc b{font-size:12px;color:#173966}.desc textarea{display:block;width:100%;height:75px;border:0;resize:none;outline:0;font-size:10px;line-height:1.45;margin-top:3px}.foot{display:flex;justify-content:space-between;border-top:1px solid #e5eaf0;margin-top:7px;padding-top:5px;font-size:8px;color:#7a8494}
@page{size:A4 portrait;margin:0}@media print{body{background:#fff}.top,.side,.tools,.adjust{display:none!important}.app,.editor,.stage{display:block;height:auto;overflow:visible;padding:0}.paper{width:210mm;height:297mm;min-height:297mm;box-shadow:none;padding:12mm 13mm}.paper:before{inset:4mm}.band{font-size:16px;padding-bottom:12px}.band span{padding:6px 12px}.title{font-size:24px;padding:22px 4px 14px}.photo{height:118mm;margin-top:16px}.desc{margin-top:16px;padding:12px 15px}.desc b{font-size:17px}.desc textarea{height:38mm;font-size:15px;line-height:1.7}.foot{font-size:11px;margin-top:16px;padding-top:10px}.mark.sel{outline:0}.handle{display:none}}
.dept{display:flex;align-items:center;font-weight:bold}.dept input{width:110px;border:0;border-bottom:1px solid #aeb8c5;background:transparent;color:#4d5c70;font:inherit;font-weight:bold;outline:0}.pagebar{height:30px;background:#f7f9fc;border-bottom:1px solid #d8e0ea;display:flex;gap:4px;align-items:center;padding:3px 9px;overflow:auto}.pagebar button{border:1px solid #d8e0ea;background:#fff;border-radius:4px;padding:3px 7px;font-size:11px}.pagebar button.on{background:#173966;color:#fff}.stage{height:calc(100vh - 118px)}
.photo>img{object-fit:cover}.arrow{display:flex;align-items:stretch}.arrow span{display:block;width:100%;height:100%;font-size:0;background:currentColor;clip-path:polygon(0 35%,68% 35%,68% 0,100% 50%,68% 100%,68% 65%,0 65%)}
.arrow{font-size:0}.arrow:before{content:"";display:block;width:100%;height:100%;background:currentColor;clip-path:polygon(0 35%,68% 35%,68% 0,100% 50%,68% 100%,68% 65%,0 65%)}
.rotateHandle{position:absolute;left:50%;top:-27px;transform:translateX(-50%);width:19px;height:19px;border-radius:50%;background:#fff;border:2px solid #2563eb;color:#2563eb;display:grid;place-items:center;font:700 12px Arial;cursor:grab;touch-action:none}.rotateHandle:after{content:"";position:absolute;width:2px;height:8px;background:#2563eb;top:17px;left:7px}@media print{.rotateHandle{display:none!important}}
.badgeEdit{margin-left:auto;width:82px;border:0;border-bottom:1px solid #c5ced9;background:transparent;color:#8791a0;font:inherit;text-align:right;outline:0}.noteEdit{width:220px;border:0;border-bottom:1px solid #c5ced9;background:transparent;color:#7a8494;font:inherit;outline:0}@media print{.badgeEdit,.noteEdit{border:0}}
.mark{transform-origin:center center}
.top{flex-wrap:nowrap;overflow:hidden;gap:8px}.top>div{flex:0 0 auto;white-space:nowrap}.tools{flex-wrap:nowrap;white-space:nowrap;overflow-x:auto;overflow-y:hidden}.tools button,.tools .upload,.tools .camera{flex:0 0 auto;white-space:nowrap;word-break:keep-all;line-height:1.15}.pagebar{flex-wrap:nowrap;white-space:nowrap}.pagebar button{flex:0 0 auto;white-space:nowrap}.camera{border:1px solid #166534;background:#dcfce7;color:#166534;border-radius:5px;padding:5px 8px;cursor:pointer;font-weight:bold}.camera input{display:none}.desc b{display:flex;align-items:center}.voiceBtn{margin-left:auto;border:1px solid #2563eb;background:#eff6ff;color:#1d4ed8;border-radius:4px;padding:3px 7px;font-size:10px;font-weight:bold}.voiceBtn.listening{background:#fee2e2;color:#b91c1c;border-color:#ef4444}.descPrint{display:none;white-space:pre-wrap;overflow-wrap:anywhere}@media print{.voiceBtn{display:none!important}.desc textarea{display:none!important}.descPrint{display:block;font-size:15px;line-height:1.7}.paper{height:auto!important}}
</style>
<style>
.mark.text{box-sizing:border-box;}
.mark.text.selected{outline:2px solid #2563eb;outline-offset:2px;}
</style>
</head><body>
<header class="top"><div class="logo">▣ 설비 안내서 제작기</div><div><button onclick="addPage()">＋ 페이지</button> <button onclick="copyPage()">복제</button> <button class="print" onclick="printAll()">전체 A4 출력</button></div></header>
<div class="app"><aside class="side"><div class="head">대목록 <button onclick="addMain()">＋</button></div><div class="list" id="mains"></div><div class="mini"><button onclick="addMain()">＋ 추가</button><button onclick="delMain()">삭제</button></div><div class="head">중목록 <button onclick="addMid()">＋</button></div><div class="list" id="mids"></div><div class="mini"><button onclick="addMid()">＋ 추가</button><button onclick="delMid()">삭제</button></div><div class="head">소목록 <button onclick="addSmall()">＋</button></div><div class="list" id="smalls"></div><div class="mini"><button onclick="addSmall()">＋ 추가</button><button onclick="delSmall()">삭제</button></div></aside>
<main class="editor"><div class="tools"><label class="camera"><input type="file" accept="image/*" capture="environment" onchange="loadPhoto(event)">📷 사진 촬영</label><label class="upload"><input type="file" accept="image/*" onchange="loadPhoto(event)">▧ 사진 첨부</label><button onclick="addMark('text')">T 텍스트</button><button onclick="addMark('box')">□ 사각형</button><button onclick="addMark('circle')">○ 원</button><button onclick="addMark('arrow')">➜ 화살표</button><button onclick="removeMark()">선택 삭제</button></div>
<div class="pagebar" id="pagebar"></div><div class="stage"><article class="paper"><div class="band"><span id="bandMain">소방</span><b id="bandSub">화재 시 행동요령</b><input class="badgeEdit" aria-label="오른쪽 위 문구" value="안전 안내서"></div><input class="title" value="화재 발생 시 초기 대응 안내">
<div class="photo" id="photo"><label class="empty" id="empty"><input type="file" accept="image/*" onchange="loadPhoto(event)"><strong>＋</strong><b>현장 사진을 첨부하세요</b><small>JPG, PNG</small></label></div>
<div class="adjust" id="adjust"><b>선택 요소</b><label>가로 <input id="rw" type="range" min="30" max="350" oninput="resizeMark()"></label><label>세로 <input id="rh" type="range" min="22" max="220" oninput="resizeMark()"></label><label>색 <input id="rc" type="color" oninput="resizeMark()"></label></div>
<div class="desc"><b>● 상세 설명 <button type="button" class="voiceBtn" onclick="toggleVoice()">🎤 음성 입력</button></b><textarea>1. 화재를 발견하면 즉시 주변에 알리고 비상벨을 누릅니다.
2. 안전이 확보된 경우에만 소화기를 사용합니다.
3. 연기가 퍼지기 전에 가장 가까운 비상구로 대피합니다.</textarea></div><div class="foot"><input class="noteEdit" aria-label="왼쪽 아래 문구" value="안전을 위해 정기적으로 내용을 확인해 주세요."><label class="dept"><input aria-label="하단 관리 문구" value="관리부서: 안전관리팀"></label></div></article></div></main></div>
<script>
let data=[{name:"소방",mids:[{name:"화재 대응",smalls:["화재 시 행동요령","비화재 시 확인사항"]},{name:"소방시설",smalls:["소화기 사용법"]}]},{name:"전기",mids:[{name:"전기 안전",smalls:["정전 시 조치","누전 점검"]}]},{name:"기기",mids:[{name:"기기 관리",smalls:["기기 작동법"]}]}],mi=0,di=0,si=0,chosen=null;
function draw(){let main=data[mi],mid=main.mids[di];mains.innerHTML=data.map((x,i)=>`<button class="${i==mi?'on':''}" onclick="mi=${i};di=0;si=0;draw()">${x.name} (${x.mids.length})</button>`).join("");mids.innerHTML=main.mids.map((x,i)=>`<button class="${i==di?'on':''}" onclick="di=${i};si=0;draw()">${x.name} (${x.smalls.length})</button>`).join("");smalls.innerHTML=mid?mid.smalls.map((x,i)=>`<button class="${i==si?'on':''}" onclick="si=${i};draw()">${x}</button>`).join(""):"";bandMain.textContent=main.name;bandSub.textContent=(mid?mid.name:"중목록 없음")+" · "+(mid?.smalls[si]||"소목록 없음")}
function addMain(){let n=prompt("대목록 이름","새 설비");if(n){data.push({name:n,mids:[]});mi=data.length-1;di=si=0;draw()}}function delMain(){if(data.length>1&&confirm("현재 대목록을 삭제할까요?")){data.splice(mi,1);mi=di=si=0;draw()}}
function addMid(){let n=prompt("중목록 이름","새 분류");if(n){data[mi].mids.push({name:n,smalls:[]});di=data[mi].mids.length-1;si=0;draw()}}function delMid(){if(data[mi].mids.length&&confirm("현재 중목록을 삭제할까요?")){data[mi].mids.splice(di,1);di=si=0;draw()}}
function addSmall(){let m=data[mi].mids[di];if(!m)return alert("중목록을 먼저 추가하세요.");let n=prompt("소목록 이름","새 안내");if(n){m.smalls.push(n);si=m.smalls.length-1;draw()}}function delSmall(){let m=data[mi].mids[di];if(m?.smalls.length&&confirm("현재 소목록을 삭제할까요?")){m.smalls.splice(si,1);si=0;draw()}}
function loadPhoto(e){let input=e.target,f=input.files[0],targetPage=pageIndex;if(!f)return;let r=new FileReader;r.onload=()=>{function put(board){board.querySelector("img")?.remove();let blank=board.querySelector(".empty");if(blank)blank.style.display="none";let im=new Image;im.src=r.result;board.prepend(im)}if(targetPage===pageIndex)put(document.querySelector(".photo"));else{let wrap=document.createElement("div");wrap.innerHTML=pageItems[targetPage].html;put(wrap.querySelector(".photo"));pageItems[targetPage].html=wrap.innerHTML}input.value=""};r.readAsDataURL(f)}
function addMark(k){let d=document.createElement("div");d.className="mark "+k;d.style.cssText="left:45px;top:35px;width:100px;height:55px;color:#ef4444;border-color:#ef4444";d.dataset.kind=k;d.dataset.rotation="0";if(k=="text"){d.contentEditable=true;d.textContent="설명 입력"}if(k=="arrow")d.textContent="➜";photo.appendChild(d);select(d);d.onpointerdown=drag}
function select(d){if(chosen)chosen.classList.remove("sel");chosen=d;d.classList.add("sel");if(!d.querySelector(".handle")){let h=document.createElement("i");h.className="handle";h.textContent="↘";d.appendChild(h)}if(d.classList.contains("arrow")||d.classList.contains("box")){let r=d.querySelector(".rotateHandle");if(!r){r=document.createElement("i");r.className="rotateHandle";r.textContent="↻";d.appendChild(r)}r.onpointerdown=e=>directRotate(e,d)}adjust.classList.add("show");rw.value=d.offsetWidth;rh.value=d.offsetHeight;rc.value=rgbHex(getComputedStyle(d).color)}
function drag(e){
if(e.target.classList.contains("handle"))return resizeDrag(e,this);
let d=this;
select(d);

if(d.isContentEditable&&e.target===d){
let r=d.getBoundingClientRect(),edge=10;
let onBorder=(e.clientX-r.left<=edge)||(r.right-e.clientX<=edge)||(e.clientY-r.top<=edge)||(r.bottom-e.clientY<=edge);
if(!onBorder){return}
}

e.preventDefault();
let x=e.clientX-d.offsetLeft,y=e.clientY-d.offsetTop;
if(d.setPointerCapture)try{d.setPointerCapture(e.pointerId)}catch(_){}
function m(v){
v.preventDefault();
d.style.left=Math.max(0,v.clientX-x)+"px";
d.style.top=Math.max(0,v.clientY-y)+"px";
}
function u(){
d.removeEventListener("pointermove",m);
d.removeEventListener("pointerup",u);
d.removeEventListener("pointercancel",u);
}
d.addEventListener("pointermove",m,{passive:false});
d.addEventListener("pointerup",u);
d.addEventListener("pointercancel",u);
}
function directRotate(e,d){e.preventDefault();e.stopPropagation();let b=d.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;function m(v){let a=(Math.atan2(v.clientY-cy,v.clientX-cx)*180/Math.PI+90+360)%360;d.dataset.rotation=Math.round(a);d.style.transform="rotate("+a+"deg)"}function u(){removeEventListener("pointermove",m);removeEventListener("pointerup",u)}addEventListener("pointermove",m);addEventListener("pointerup",u)}
function resizeDrag(e,d){e.stopPropagation();let x=e.clientX,y=e.clientY,w=d.offsetWidth,h=d.offsetHeight;function m(v){d.style.width=Math.max(30,w+v.clientX-x)+"px";d.style.height=Math.max(22,h+v.clientY-y)+"px";rw.value=d.offsetWidth;rh.value=d.offsetHeight}function u(){removeEventListener("pointermove",m);removeEventListener("pointerup",u)}addEventListener("pointermove",m);addEventListener("pointerup",u)}
function resizeMark(){if(!chosen)return;chosen.style.width=rw.value+"px";chosen.style.height=rh.value+"px";chosen.style.color=rc.value;chosen.style.borderColor=rc.value}function removeMark(){if(chosen){chosen.remove();chosen=null;adjust.classList.remove("show")}}function newDoc(){document.querySelector(".title").value="새 안내서";document.querySelector(".desc textarea").value="";document.querySelector(".badgeEdit").value="안전 안내서";document.querySelector(".noteEdit").value="안전을 위해 정기적으로 내용을 확인해 주세요.";document.querySelector(".dept input").value="관리부서: 안전관리팀";let board=document.querySelector(".photo"),blank=board.querySelector(".empty");board.querySelectorAll("img,.mark").forEach(x=>x.remove());blank.style.display="grid";chosen=null;adjust.classList.remove("show")}function rgbHex(c){let m=c.match(/\d+/g);return m?"#"+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,"0")).join(""):"#ef4444"}
function paperHTML(){let src=document.querySelector(".paper"),c=src.cloneNode(true),a=src.querySelectorAll("input,textarea");c.querySelectorAll(".descPrint").forEach(x=>x.remove());let b=c.querySelectorAll("input,textarea");a.forEach((x,i)=>{if(x.tagName=="TEXTAREA"){b[i].textContent=x.value;let d=document.createElement("div");d.className="descPrint";d.textContent=x.value;b[i].after(d)}else b[i].setAttribute("value",x.value)});c.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));c.querySelectorAll(".handle").forEach(x=>x.remove());return c.innerHTML}
let pageItems=[],pageIndex=0;function savePage(){if(pageItems.length)pageItems[pageIndex]={html:paperHTML(),mi,di,si}}function restorePage(){let p=pageItems[pageIndex];document.querySelector(".paper").innerHTML=p.html;mi=p.mi;di=p.di;si=p.si;chosen=null;document.querySelectorAll(".mark").forEach(x=>x.onpointerdown=drag);adjust.classList.remove("show");draw();pageButtons()}
function pageButtons(){pagebar.innerHTML=pageItems.map((_,i)=>`<button class="${i==pageIndex?'on':''}" onclick="goPage(${i})">${i+1}쪽</button>`).join("")+`<button onclick="addPage()">＋</button><button onclick="delPage()">쪽 삭제</button>`}
function goPage(i){savePage();pageIndex=i;restorePage()}function addPage(){savePage();newDoc();mi=di=si=0;draw();pageItems.push({html:paperHTML(),mi,di,si});pageIndex=pageItems.length-1;restorePage()}function copyPage(){savePage();pageItems.push({...pageItems[pageIndex]});pageIndex=pageItems.length-1;restorePage()}function delPage(){if(pageItems.length<2)return alert("페이지가 한 장뿐입니다.");if(!confirm("현재 페이지를 삭제할까요?"))return;pageItems.splice(pageIndex,1);pageIndex=Math.max(0,pageIndex-1);restorePage()}
function printAll(){savePage();let css=document.querySelector("style").textContent,w=open("","_blank");if(!w)return alert("팝업을 허용해 주세요.");let body=pageItems.map((p,i)=>`<article class="paper" style="page-break-after:${i===pageItems.length-1?'auto':'always'}">${p.html}</article>`).join("");w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>안내서 출력</title><style>${css}body{background:#fff}.paper{display:block;margin:0}.handle,.adjust,.voiceBtn{display:none!important}</style></head><body>${body}<script>onload=()=>{print();close()}<\/script></body></html>`);w.document.close()}
function mergeSpeech(a,b){a=a.trim();b=b.trim();if(!a)return b;if(!b)return a;let left=a.split(/\s+/),right=b.split(/\s+/);for(let n=Math.min(left.length,right.length);n>0;n--)if(left.slice(-n).join(" ")===right.slice(0,n).join(" "))return left.concat(right.slice(n)).join(" ");return a+" "+b}let voiceRecognition=null;function toggleVoice(){let btn=document.querySelector(".voiceBtn"),area=document.querySelector(".desc textarea");if(voiceRecognition){voiceRecognition.stop();return}let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert("이 브라우저는 음성 입력을 지원하지 않습니다. 휴대폰 Chrome에서 열어 주세요.");let base=area.value.trim(),r=new R;r.lang="ko-KR";r.continuous=true;r.interimResults=true;r.onresult=e=>{let spoken="";for(let i=0;i<e.results.length;i++)spoken=mergeSpeech(spoken,e.results[i][0].transcript);area.value=(base?base+"\n":"")+spoken};r.onerror=e=>{if(e.error==="not-allowed")alert("음성 입력을 사용하려면 마이크 권한을 허용해 주세요.")};r.onend=()=>{voiceRecognition=null;btn.textContent="🎤 음성 입력";btn.classList.remove("listening")};voiceRecognition=r;btn.textContent="■ 음성 중지";btn.classList.add("listening");r.start()}
draw();pageItems=[{html:paperHTML(),mi,di,si}];pageButtons();

document.addEventListener("keydown",function(e){
if(e.key!=="Delete"&&e.key!=="Backspace")return;
let a=document.activeElement;
if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"||a.isContentEditable))return;
if(chosen&&chosen.classList&&chosen.classList.contains("mark")){
e.preventDefault();chosen.remove();chosen=null;adjust.classList.remove("show");
}
});
</script></body></html>
